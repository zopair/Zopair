name: AgentProof Pages
on:
  push:
    branches: [main]
    paths: ['agentproof/**', '.github/workflows/agentproof-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: agentproof-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v4.2.2
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Prepare static site and raster cover
        run: |
          mkdir -p "$RUNNER_TEMP/agentproof-site"
          cp -a agentproof/. "$RUNNER_TEMP/agentproof-site/"
          convert "$RUNNER_TEMP/agentproof-site/cover.svg" "$RUNNER_TEMP/agentproof-site/cover.png"
          tar --dereference --hard-dereference --directory "$RUNNER_TEMP/agentproof-site" -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5