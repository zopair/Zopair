name: Demo Link Verification

on:
  pull_request:
    paths:
      - "scripts/check-demo-links.mjs"
      - "scripts/check-demo-links.test.mjs"
      - "scripts/demo-links.json"
      - ".github/workflows/demo-link-verification.yml"
  push:
    branches: [main]
    paths:
      - "scripts/check-demo-links.mjs"
      - "scripts/check-demo-links.test.mjs"
      - "scripts/demo-links.json"
      - ".github/workflows/demo-link-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-link-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test link checker
        run: node --test scripts/check-demo-links.test.mjs
      - name: Verify published demos
        run: node scripts/check-demo-links.mjs
