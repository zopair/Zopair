name: AgentProof CI
on:
  push:
    paths: ['agentproof/**', '.github/workflows/agentproof-ci.yml']
  pull_request:
    paths: ['agentproof/**', '.github/workflows/agentproof-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentproof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check