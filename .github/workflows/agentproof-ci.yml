name: AgentProof CI
on:
  push:
    paths: ['agentproof/**', '.github/workflows/agentproof-ci.yml']
  pull_request:
    paths: ['agentproof/**', '.github/workflows/agentproof-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentproof
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run check