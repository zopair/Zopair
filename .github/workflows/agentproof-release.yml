name: AgentProof Release
on:
  push:
    tags: ['agentproof-v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v4.2.2
      - name: Build downloadable ZIP
        run: |
          cd agentproof
          zip -r "../AgentProof-$GITHUB_REF_NAME.zip" . -x 'node_modules/*'
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "AgentProof-$GITHUB_REF_NAME.zip" --title "AgentProof $GITHUB_REF_NAME" --notes "Local-first AI agent reliability and safety test kit. See README.md inside the archive for scope and limitations."